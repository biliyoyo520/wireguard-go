name: Go

on:
  push:
    branches: [ "bo/dflybsd-port" ]
  pull_request:
    branches: [ "bo/dflybsd-port" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GO111MODULE: off
      CGO_ENABLED: 0

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'

    - name: Show Go Environment
      run: |
        go version
        go env

    # =========================
    # Linux 构建
    # =========================
    - name: Build (Linux)
      run: |
        GOOS=linux GOARCH=amd64 go build -v -o wireguard-go-linux

    # =========================
    # DragonFly 构建
    # =========================
    - name: Build (DragonFly BSD)
      run: |
        GOOS=dragonfly GOARCH=amd64 go build -v -o wireguard-go-dragonfly

    # =========================
    # 上传构建产物
    # =========================
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: wireguard-go-build
        path: |
          wireguard-go-linux
          wireguard-go-dragonfly
